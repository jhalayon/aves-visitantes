services:
  avian-display:
    image: nginx:alpine
    container_name: avian-display
    restart: unless-stopped
    ports:
      - "${DISPLAY_PORT:-8091}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BIRDNET_HOST: "${BIRDNET_HOST:-host.docker.internal}"
      BIRDNET_PORT: "${BIRDNET_PORT:-8090}"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./runtime:/usr/share/nginx/html/runtime:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    secrets:
      - ebird_htpasswd
    networks:
      - avian-net

  avian-analytics:
    image: node:22-alpine
    container_name: avian-analytics
    restart: unless-stopped
    command: ["node", "/srv/server.js"]
    environment:
      ANALYTICS_PORT: 3000
      ANALYTICS_DATA_FILE: /data/analytics.json
    volumes:
      - ./analytics:/srv:ro
      - ./runtime:/data
    networks:
      - avian-net

networks:
  avian-net:
    name: avian-net
    external: true

secrets:
  ebird_htpasswd:
    file: ${EBIRD_AUTH_FILE:-./config/ebird.htpasswd}
